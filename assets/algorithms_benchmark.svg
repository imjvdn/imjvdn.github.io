<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" role="img"><rect width="940" height="540" fill="#fff"/><g font-family="Segoe UI,Arial" fill="#172633"><text x="32" y="44" font-size="25" font-weight="700">Ranking a shortlist of 10 from 100,000 records</text><text x="32" y="76" font-size="16">September 26 benchmark · five measured repetitions · prebuilt synthetic records</text><text x="32" y="112" font-size="17" font-weight="600">Median ranking time</text><text x="32" y="143" font-size="15">Heap</text><rect x="205" y="124" width="342.02" height="24" fill="#245778"/><text x="557.02" y="142" font-size="15">273.618 ms</text><text x="32" y="174" font-size="15">Full sort</text><rect x="205" y="155" width="432.13" height="24" fill="#af7132"/><text x="647.13" y="173" font-size="15">345.706 ms</text><text x="32" y="224" font-size="17" font-weight="600">Peak traced temporary allocation</text><text x="32" y="255" font-size="15">Heap</text><rect x="205" y="236" width="2.00" height="24" fill="#245778"/><text x="217.00" y="254" font-size="15">3.650 KiB</text><text x="32" y="286" font-size="15">Full sort</text><rect x="205" y="267" width="449.25" height="24" fill="#af7132"/><text x="664.25" y="285" font-size="15">17,970.020 KiB</text><text x="32" y="336" font-size="17" font-weight="600">Small input trade-off: n=1,000 and k=100</text><text x="32" y="367" font-size="15">Heap</text><rect x="205" y="348" width="403.50" height="24" fill="#245778"/><text x="618.50" y="366" font-size="15">1.614 ms</text><text x="32" y="398" font-size="15">Full sort</text><rect x="205" y="379" width="340.25" height="24" fill="#af7132"/><text x="555.25" y="397" font-size="15">1.361 ms</text><text x="32" y="470" font-size="14">Full sort was faster for the small-input case. All measured result sets matched.</text><text x="32" y="493" font-size="14">Allocation excludes prebuilt inputs, database reads, network traffic and browser rendering.</text></g></svg>