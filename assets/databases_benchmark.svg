<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" role="img"><rect width="940" height="540" fill="#fff"/><g font-family="Segoe UI,Arial" fill="#172633"><text x="32" y="44" font-size="25" font-weight="700">Database paging and streaming trade-offs</text><text x="32" y="76" font-size="16">September 29 benchmark · 10,000 fictional records · local MongoDB</text><text x="32" y="112" font-size="17" font-weight="600">Deep page median time for the same 50 rows</text><text x="32" y="143" font-size="15">Keyset</text><rect x="205" y="124" width="55.62" height="24" fill="#245778"/><text x="270.62" y="142" font-size="15">0.445 ms</text><text x="32" y="174" font-size="15">Skip</text><rect x="205" y="155" width="405.00" height="24" fill="#af7132"/><text x="620.00" y="173" font-size="15">3.240 ms</text><text x="32" y="224" font-size="17" font-weight="600">Median peak traced Python allocation</text><text x="32" y="255" font-size="15">Streamed</text><rect x="205" y="236" width="5.35" height="24" fill="#245778"/><text x="220.35" y="254" font-size="15">0.160 MB</text><text x="32" y="286" font-size="15">Materialized</text><rect x="205" y="267" width="439.66" height="24" fill="#af7132"/><text x="654.66" y="285" font-size="15">13.190 MB</text><text x="32" y="336" font-size="17" font-weight="600">Median database read plus ranking time</text><text x="32" y="367" font-size="15">Streamed</text><rect x="205" y="348" width="428.17" height="24" fill="#245778"/><text x="643.17" y="366" font-size="15">145.577 ms</text><text x="32" y="398" font-size="15">Materialized</text><rect x="205" y="379" width="138.67" height="24" fill="#af7132"/><text x="353.67" y="397" font-size="15">47.149 ms</text><text x="32" y="470" font-size="14">Streaming used less traced memory but took longer. These are observations, not guarantees.</text><text x="32" y="493" font-size="14">Memory excludes server allocation and is not total process RAM. See the raw benchmark report.</text></g></svg>